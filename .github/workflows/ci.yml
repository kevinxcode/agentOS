name: Foundation gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  COREPACK_HOME: ${{ github.workspace }}/.corepack
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_DB: agentos_test
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - run: |
          python -m pip install uv==0.12.8
          uv sync --frozen --project services/api --extra dev
          uv pip install --python services/api/.venv/bin/python PyYAML==6.0.2
      - run: |
          services/api/.venv/bin/ruff check services/api tests scripts
          services/api/.venv/bin/mypy services/api/src
          services/api/.venv/bin/pytest -q
      - name: Migrated PostgreSQL singleton, timezone and staged-auth gate
        env:
          AGENTOS_TEST_DATABASE_URL: postgresql+asyncpg://agentos:ci-disposable-only@127.0.0.1:5432/agentos_test
        run: services/api/.venv/bin/pytest tests/acceptance/test_foundation_acceptance.py -q
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - run: |
          npm install --global corepack@0.34.6
          corepack pnpm@10.15.1 install --frozen-lockfile
          corepack pnpm@10.15.1 lint
          corepack pnpm@10.15.1 typecheck
          corepack pnpm@10.15.1 test
          corepack pnpm@10.15.1 build
      - name: Real Chromium against controlled auth service
        run: |
          corepack pnpm@10.15.1 --filter @agentos/web exec playwright install --with-deps chromium
          corepack pnpm@10.15.1 --filter @agentos/web test:e2e
  compose-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          python3 scripts/generate_env.py /tmp/agentos-ci.env https://agentos.example.com:443/
          scripts/agentos-compose.sh agentos-ci /tmp/agentos-ci.env config --quiet
          for script in scripts/*.sh; do bash -n "$script"; done
          shellcheck -x scripts/*.sh
          docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -color
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - run: |
          python -m pip install pip-audit==2.9.0
          pip-audit --requirement services/api/requirements.lock --disable-pip --no-deps
          npm install --global corepack@0.34.6
          corepack pnpm@10.15.1 install --frozen-lockfile
          corepack pnpm@10.15.1 audit --audit-level high
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: api, dockerfile: services/api/Dockerfile}
          - {name: web, dockerfile: apps/web/Dockerfile}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: docker build -f '${{ matrix.dockerfile }}' -t 'agentos-${{ matrix.name }}:ci' .
      - name: Fail on high or critical image vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.61.1 image --exit-code 1 --severity HIGH,CRITICAL
          --scanners vuln --pkg-types os,library --ignore-unfixed
          'agentos-${{ matrix.name }}:ci'
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [backend, frontend, compose-contracts, dependency-audit, containers]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.16.0'}
      - run: |
          npm install --global corepack@0.34.6
          corepack pnpm@10.15.1 install --frozen-lockfile
          corepack pnpm@10.15.1 --filter @agentos/web exec playwright install --with-deps chromium
          bash scripts/compose_smoke.sh
          bash scripts/acceptance_smoke.sh
