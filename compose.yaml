name: agentos

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      AGENTOS_API_URL: http://api:8000
      AGENTOS_PUBLIC_ORIGIN: "${AGENTOS_PUBLIC_ORIGIN:?Set AGENTOS_PUBLIC_ORIGIN}"
      AGENTOS_AUTH_PROXY_SECRET: "${AGENTOS_AUTH_PROXY_SECRET:?Set AGENTOS_AUTH_PROXY_SECRET}"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - target: 3000
        published: "${AGENTOS_WEB_PORT:-3000}"
        host_ip: 127.0.0.1
        protocol: tcp
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - agentos_private
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      AGENTOS_ENVIRONMENT: production
      AGENTOS_DATABASE_URL: "${AGENTOS_DATABASE_URL:?Set AGENTOS_DATABASE_URL}"
      AGENTOS_REDIS_URL: "${AGENTOS_REDIS_URL:?Set AGENTOS_REDIS_URL}"
      AGENTOS_MINIO_ENDPOINT: "${AGENTOS_MINIO_ENDPOINT:?Set AGENTOS_MINIO_ENDPOINT}"
      AGENTOS_MINIO_ACCESS_KEY: "${AGENTOS_MINIO_ACCESS_KEY:?Set AGENTOS_MINIO_ACCESS_KEY}"
      AGENTOS_MINIO_SECRET_KEY: "${AGENTOS_MINIO_SECRET_KEY:?Set AGENTOS_MINIO_SECRET_KEY}"
      AGENTOS_MINIO_BUCKET: "${AGENTOS_MINIO_BUCKET:?Set AGENTOS_MINIO_BUCKET}"
      AGENTOS_SESSION_PEPPER: "${AGENTOS_SESSION_PEPPER:?Set AGENTOS_SESSION_PEPPER}"
      AGENTOS_MASTER_KEY: "${AGENTOS_MASTER_KEY:?Set AGENTOS_MASTER_KEY}"
      AGENTOS_AUTH_PROXY_SECRET: "${AGENTOS_AUTH_PROXY_SECRET:?Set AGENTOS_AUTH_PROXY_SECRET}"
      AGENTOS_COOKIE_SECURE: "true"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - agentos_private
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: "${AGENTOS_POSTGRES_DB:?Set AGENTOS_POSTGRES_DB}"
      POSTGRES_USER: "${AGENTOS_POSTGRES_USER:?Set AGENTOS_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${AGENTOS_POSTGRES_PASSWORD:?Set AGENTOS_POSTGRES_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/compose/postgres/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    networks:
      - agentos_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4.2-alpine3.21
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    user: redis
    expose:
      - "6379"
    networks:
      - agentos_private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: "${AGENTOS_MINIO_ACCESS_KEY:?Set AGENTOS_MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${AGENTOS_MINIO_SECRET_KEY:?Set AGENTOS_MINIO_SECRET_KEY}"
    expose:
      - "9000"
    volumes:
      - minio_data:/data
    networks:
      - agentos_private
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc --config-dir /tmp/.mc alias set agentos http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        && mc --config-dir /tmp/.mc mb --ignore-existing "agentos/$$MINIO_BUCKET"
    environment:
      MINIO_ROOT_USER: "${AGENTOS_MINIO_ACCESS_KEY:?Set AGENTOS_MINIO_ACCESS_KEY}"
      MINIO_ROOT_PASSWORD: "${AGENTOS_MINIO_SECRET_KEY:?Set AGENTOS_MINIO_SECRET_KEY}"
      MINIO_BUCKET: "${AGENTOS_MINIO_BUCKET:?Set AGENTOS_MINIO_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - agentos_private
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  agentos_private:
    internal: true

volumes:
  postgres_data:
  minio_data:
