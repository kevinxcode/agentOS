[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos"
version = "0.1.0"
description = "AgentOS control-plane API"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.1",
  "argon2-cffi==23.1.0",
  "asyncpg==0.30.0",
  "boto3==1.38.33",
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "pydantic-settings==2.9.1",
  "pyotp==2.9.0",
  "redis==6.2.0",
  "SQLAlchemy==2.0.41",
  "structlog==25.4.0",
  "uvicorn[standard]==0.34.3"
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.21.0",
  "httpx==0.28.1",
  "mypy==1.16.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.11.13"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
